# Сервисы для локальной разработки. Django запускается на хосте из .venv (make run).
name: proinvest

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proinvest
      POSTGRES_USER: proinvest
      POSTGRES_PASSWORD: proinvest
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proinvest -d proinvest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Перехват исходящей почты: веб-интерфейс http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
