{# Без кейсов секция не выводится #}
{% if cards %}
<section{% if value.anchor %} id="{{ value.anchor }}"{% endif %} class="section scroll-mt-20{% if value.background == 'surface' %} bg-surface{% endif %}">
  <div class="container-site">
    {% include "blocks/_section_header.html" %}
    <div class="mt-10 grid gap-6 md:mt-12 md:grid-cols-2 lg:grid-cols-3">
      {% for card in cards %}{% include "blocks/_case_card.html" %}{% endfor %}
    </div>
    {% if value.more.text %}
    <div class="mt-10">{% include "blocks/_button.html" with link=value.more css="btn-outline" %}</div>
    {% endif %}
  </div>
</section>
{% endif %}
