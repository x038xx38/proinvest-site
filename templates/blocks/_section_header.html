{% if value.eyebrow or value.title or value.intro %}
<div class="max-w-3xl">
  {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
  {% if value.title %}<h2{% if value.eyebrow %} class="mt-3"{% endif %}>{{ value.title }}</h2>{% endif %}
  {% if value.intro %}<p class="mt-4 text-lg text-ink-soft">{{ value.intro|linebreaksbr }}</p>{% endif %}
</div>
{% endif %}
