{% extends "blocks/_section.html" %}
{% load core_tags %}
{% block body %}
<ul class="mt-10 grid gap-6 md:mt-12 md:grid-cols-2{% if value.columns == '3' %} lg:grid-cols-3{% elif value.columns == '4' %} lg:grid-cols-4{% endif %}">
  {% for item in value.items %}
  <li class="card flex flex-col gap-4">
    <span class="icon-badge">{% icon item.icon %}</span>
    <h3 class="text-lg md:text-xl">{{ item.title }}</h3>
    {% if item.text %}<p class="text-ink-soft">{{ item.text|linebreaksbr }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endblock %}
