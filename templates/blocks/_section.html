{# Обёртка секции: фон, якорь, заголовок. Блоки наследуют её и заполняют block body #}
<section{% if value.anchor %} id="{{ value.anchor }}"{% endif %} class="section scroll-mt-20{% if value.background == 'surface' %} bg-surface{% endif %}">
  <div class="container-site">
    {% include "blocks/_section_header.html" %}
    {% block body %}{% endblock %}
  </div>
</section>
