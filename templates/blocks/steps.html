{% extends "blocks/_section.html" %}
{% block body %}
<ol class="mt-10 grid gap-6 md:mt-12 md:grid-cols-2{% if value.items|length == 4 %} lg:grid-cols-4{% else %} lg:grid-cols-3{% endif %}">
  {% for item in value.items %}
  <li class="relative flex flex-col gap-3 border-t-2 border-ink pt-6">
    <span class="text-4xl font-extrabold text-accent">{{ forloop.counter|stringformat:"02d" }}</span>
    <h3 class="text-lg md:text-xl">{{ item.title }}</h3>
    {% if item.text %}<p class="text-ink-soft">{{ item.text|linebreaksbr }}</p>{% endif %}
  </li>
  {% endfor %}
</ol>
{% endblock %}
